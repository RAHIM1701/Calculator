<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">  
</head>
<body>
<div class="header">Calculator</div>
<div class="calculatorArea">
<div class="calculator">
    <div class="display">
        <div class="oldOpperation"></div>
        <div class="newOpperation"></div>
    </div>
    <div class="rowOne">
        <button id="acButton">AC</button>
        <button id="deleteButton">⌫</button>
        <button class="opKeys" value="/">/</button>
    </div>
    <div class="rowTwo">
        <button value="9" class="numbKeys">9</button>
        <button value="8" class="numbKeys">8</button>
        <button value="7" class="numbKeys">7</button>
        <button class="opKeys" value="*">x</button>
    </div>
    <div class="rowThree">
        <button value="6" class="numbKeys">6</button>
        <button value="5" class="numbKeys">5</button>
        <button value="4" class="numbKeys">4</button>
        <button class="opKeys" value="-">-</button>
    </div>
    <div class="rowFuor">
        <button value="1" class="numbKeys">1</button>
        <button value="2" class="numbKeys">2</button>
        <button value="3" class="numbKeys">3</button>
        <button class="opKeys" value="+">+</button>
    </div>
    <div class="rowFive">
        <button value="0" class="numbKeys">0</button>
        <button value="." id="dot">.</button>
        <button class="result">=</button>
    </div>
</div>
</div>
<div class="footer">
    <p>Created by <a href="https://github.com/RAHIM1701"> RAHIM1701</a> <br> as part of The Odin Project</p>
</div>
</body>
</html>
